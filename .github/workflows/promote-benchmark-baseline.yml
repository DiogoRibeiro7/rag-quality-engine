name: Promote benchmark baseline artifact

on:
  push:
    branches:
      - benchmarks/activate-first-baseline
    paths:
      - .github/workflows/promote-benchmark-baseline.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out baseline branch
        uses: actions/checkout@v7
        with:
          ref: benchmarks/activate-first-baseline

      - name: Download reviewed CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/11771971488/zip \
            > /tmp/rag-evaluation.zip
          mkdir -p /tmp/rag-evaluation
          unzip -q /tmp/rag-evaluation.zip -d /tmp/rag-evaluation

      - name: Validate and stage baseline
        run: |
          mkdir -p benchmarks/baseline
          cp /tmp/rag-evaluation/benchmark-summary.json \
            benchmarks/baseline/benchmark-summary.json
          cp /tmp/rag-evaluation/cases.json \
            benchmarks/baseline/cases.json
          python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(".")
          summary_path = root / "benchmarks/baseline/benchmark-summary.json"
          cases_path = root / "benchmarks/baseline/cases.json"
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          cases = json.loads(cases_path.read_text(encoding="utf-8"))

          if summary.get("passed") is not True:
              raise SystemExit("Refusing to promote a failed benchmark.")
          if len(cases) != summary["case_count"]:
              raise SystemExit("Case count does not match benchmark summary.")
          queries = [case["query"] for case in cases]
          if len(set(queries)) != len(queries):
              raise SystemExit("Benchmark cases must contain unique queries.")

          init_text = (root / "src/ragops_lab/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__ = "([^"]+)"', init_text)
          if match is None:
              raise SystemExit("Unable to resolve project version.")

          manifest = {
              "project_version": match.group(1),
              "git_commit": "ad0934fa5f3092cf53b85c3dbd64ad27af530964",
              "promoted_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "benchmark_fingerprint": summary["provenance"]["fingerprint"],
          }
          (root / "benchmarks/baseline/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit promoted baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/baseline/benchmark-summary.json
          git add benchmarks/baseline/cases.json
          git add benchmarks/baseline/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Activate first reviewed benchmark baseline"
          git push origin HEAD:benchmarks/activate-first-baseline

[project]
name = "ragops-lab"
version = "0.2.0"
description = "RAGOps Lab is an open-source software project for building, testing, and observing retrieval-augmented generation systems."
authors = [{ name = "Diogo Ribeiro", email = "hansolo.dj@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
keywords = ["rag", "llmops", "retrieval", "evaluation", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.13.5,<3.0.0",
    "typer>=0.12.3,<0.13.0",
    "click>=8.1,<8.2",
    "rich>=13.7.1,<14.0.0",
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.2.2,<3.0.0",
    "fastapi>=0.137.2,<0.138.0",
    "uvicorn>=0.30.1,<0.31.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "rank-bm25>=0.2.2,<0.3.0",
    "streamlit>=1.63.0,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
]

[project.scripts]
ragops-lab = "ragops_lab.cli:app"

[tool.poetry]
packages = [{ include = "ragops_lab", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
httpx2 = "^2.4.0"
mypy = "^2.3.0"
ruff = "^0.16.1"
pre-commit = "^4.6.1"
nbval = "^0.11.0"
matplotlib = "^3.11.1"
seaborn = "^0.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
